services:
  - type: web
    name: samurai-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_samurai:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAMURAI_API_TOKEN
        sync: false
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
